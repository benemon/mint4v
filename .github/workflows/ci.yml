name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.12.2

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: make test JUNIT_REPORT=unit.xml
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        # Dependabot PRs run with a read-only token that cannot create
        # check runs, so the report step is skipped for them.
        if: ${{ always() && github.actor != 'dependabot[bot]' }}
        with:
          name: Unit Test Results
          path: unit.xml
          reporter: java-junit

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Helm lint and render
        run: |
          make helm-lint
          helm template smoke charts/mint4v > /dev/null
          helm template smoke charts/mint4v --set tokenSecretName=legacy --set tokenAudience="" \
            --set vaultCASecret=vault-ca --set targetCASecret=target-ca --set credentialsSecret=creds > /dev/null
          helm template smoke charts/mint4v --set vaultCA=pem --set targetCA=pem \
            --set-string credentials=dummy > /dev/null
          # Inline and existing-Secret forms are mutually exclusive; render must fail.
          ! helm template smoke charts/mint4v --set vaultCA=pem --set vaultCASecret=other > /dev/null 2>&1
