name: E2E

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.24.0
      - name: Run e2e suite (KIND + real Vault + mock CP4D)
        env:
          # Switches the dev Vault to Vault Enterprise and enables the
          # namespace specs; without it those specs skip.
          VAULT_LICENSE: ${{ secrets.VAULT_LICENSE }}
        run: make test-e2e JUNIT_REPORT=e2e.xml
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ always() && github.actor != 'dependabot[bot]' }}
        with:
          name: E2E Test Results
          path: e2e.xml
          reporter: java-junit
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n mint4v-e2e describe pods || true
          kubectl -n mint4v-e2e logs deployment/mint4v --tail=100 || true
          kubectl -n mint4v-e2e logs deployment/mockcpd --tail=50 || true
