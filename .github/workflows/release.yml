name: Release

# Tag-triggered release, gated on the full test suite. Deliberately no
# container build: releases ship the mint4v binaries and the packaged Helm
# chart (GitHub attaches the source archives automatically). Images are
# built by the consumer (`make docker-build` or `make ocp-build`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: make test

  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write

  release:
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    permissions:
      contents: write
      id-token: write     # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build binaries
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${platform%/*} GOARCH=${platform#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o dist/mint4v ./cmd
            tar -czf "dist/mint4v_${GITHUB_REF_NAME}_${platform%/*}_${platform#*/}.tar.gz" -C dist mint4v
            rm dist/mint4v
          done
      - name: Package Helm chart
        run: |
          helm package charts/mint4v --destination dist \
            --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      # Keyless signature over SHA256SUMS, which covers every release artifact.
      # Verify with:
      #   cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
      #     --certificate-identity-regexp '^https://github.com/benemon/mint4v/\.github/workflows/release\.yml@' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
