apiVersion: v2
name: mint4v
description: >-
  Mints short-lived Vault tokens from a Kubernetes ServiceAccount identity and
  pushes them to a target API (e.g. Cloud Pak for Data), replacing long-lived
  static Vault tokens. Handles renewal, rotation, and revocation.
type: application
version: 0.2.0
appVersion: "0.2.0"
